name: Validate and publish AIMIA website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 09:17 Asia/Shanghai (GitHub may queue the run).
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh public GitHub Star metrics
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.repository == 'AIMIA-EAI/AIMIA-EAI.github.io'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm metrics:github
      - name: Refresh public Scholar citation metrics
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.repository == 'AIMIA-EAI/AIMIA-EAI.github.io'
        run: pnpm metrics:scholar
      - name: Test Scholar parsing and retention rules
        run: pnpm test:scholar
      - name: Validate content, build and check links
        run: pnpm build
      - name: Upload website for publication
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.repository == 'AIMIA-EAI/AIMIA-EAI.github.io'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.repository == 'AIMIA-EAI/AIMIA-EAI.github.io'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish accepted build
        id: deployment
        uses: actions/deploy-pages@v4
